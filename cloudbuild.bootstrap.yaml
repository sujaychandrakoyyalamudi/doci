# Build-only pipeline for the initial deployment. No existing Cloud Run service required.
substitutions:
  _REGION: us-central1
  _REPOSITORY: doci
steps:
  - id: backend-checks
    name: python:3.12-slim
    entrypoint: bash
    args: ['-c', 'pip install uv==0.11.18 && uv sync --frozen --all-extras && uv run ruff check backend && uv run pytest -q']
  - id: image
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$BUILD_ID', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$BUILD_ID']
images: ['${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$BUILD_ID']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s

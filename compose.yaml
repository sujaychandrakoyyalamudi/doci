services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: doci
      POSTGRES_USER: doci
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in your local environment}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doci -d doci"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      APP_ENV: local
      AUTH_MODE: demo
      MODEL_PROVIDER: demo
      DATABASE_URL: postgresql+psycopg://doci:${LOCAL_POSTGRES_PASSWORD}@postgres:5432/doci
      CHECKPOINT_URL: postgresql://doci:${LOCAL_POSTGRES_PASSWORD}@postgres:5432/doci
      DATA_DIR: /app/.data
      LANGSMITH_TRACING: "false"
    volumes: ["documents:/app/.data"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  documents:
